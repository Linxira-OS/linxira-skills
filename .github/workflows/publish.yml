name: Publish

# Publishes @linxiraos/linxira-skills through npm trusted publishing (OIDC)
# and then creates the matching GitHub Release on the same tag, so a version
# is never half-released: the Release page appears only after npm accepted the
# signed publish.
#
# Single trigger source: pushing a v* tag. Creating the Release here does NOT
# re-trigger this workflow (no `release: published` trigger), which avoids
# duplicate-publish loops.
#
# Requires the npm-side trusted publisher binding to match exactly:
#   repository owner/name: Linxira-OS/linxira-skills
#   workflow filename:     publish.yml
#   environment:           npm
# No NPM_TOKEN secret is used.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and create GitHub Release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Audit first-party skill metadata
        shell: pwsh
        run: ./scripts/audit-first-party-skills.ps1
      - name: Test
        run: npm test
      - name: Publish to npm (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
